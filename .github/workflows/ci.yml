name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    # Every branch the flow protects, so that a required check is never one that had no reason to run.
    branches: [main, staging, dev, 'project/**']
  schedule:
    # Versions are pinned exactly with no lockfile, so a rotted transitive turns this red on its own.
    - cron: '0 6 * * 1'

jobs:
  repository:
    runs-on: ubuntu-latest
    # A hang fails the job in minutes rather than at GitHub's six-hour limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cli
      - run: pnpm lint
        working-directory: cli
      - run: pnpm typecheck
        working-directory: cli
      - run: pnpm test
        working-directory: cli

  packaged:
    # The path a user actually takes. npm deletes files from a tarball, so only installing proves what ships.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cli
      - run: pnpm build
        working-directory: cli
      - run: npm pack --pack-destination ${{ runner.temp }}
        working-directory: cli
      - name: Install the packed CLI
        run: |
          npm init -y
          npm install ${{ runner.temp }}/*.tgz
        working-directory: ${{ runner.temp }}
      - name: Generate from the installed package
        run: ./node_modules/.bin/prumo new packaged --types api,web --single-tenant --no-mcp --no-email --no-social --skip-install
        working-directory: ${{ runner.temp }}
      - name: Assert what npm is known to delete arrived anyway
        run: |
          for file in .gitignore apps/api/.gitignore apps/web/.gitignore \
                      .gitattributes .githooks/pre-commit apps/api/.env.example .prumo/INDEX.md \
                      .github/workflows/flow.yml .github/rulesets/flow.json .github/rulesets/project.json; do
            test -f "$file" || { echo "missing $file"; exit 1; }
          done
          ! test -e gitignore
        working-directory: ${{ runner.temp }}/packaged

  generated:
    # Explicit, because the rulesets require these names and a matrix key added later would change the default.
    name: generated (${{ matrix.name }}, ${{ matrix.types }}, ${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: an-api
            types: api
            architecture: alone
            flags: --no-email
          - name: a-web
            types: web
            architecture: alone
          - name: a-mobile
            types: mobile
            architecture: alone
          - name: a-site
            types: site
            architecture: alone
          # One type laid out as a workspace, and the one multi-tenant project.
          - name: a-tenant-workspace
            types: api
            architecture: monorepo
            tenancy: --multi-tenant
            flags: --email
          # The one project with MCP: every other one proves the templates run with it cut out.
          - name: everything
            types: api,web,mobile,site
            architecture: monorepo
            flags: --mcp --email --social google,apple
          # Apps named on purpose: a renamed api, and a second web and site, each verified, the api trusting both webs.
          - name: named-apps
            types: web,site
            architecture: monorepo
            flags: --app server=api --app backoffice=web --app blog=site --no-mcp --email --social google
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cli
      # The layout always comes from the matrix: one type needs --alone or --monorepo, several accept --monorepo.
      - name: Generate ${{ matrix.name }}
        run: node ${{ github.workspace }}/cli/src/cli.ts new ${{ matrix.name }} --types ${{ matrix.types }} --${{ matrix.architecture }} ${{ matrix.tenancy || '--single-tenant' }} ${{ matrix.flags }}
        working-directory: ${{ runner.temp }}
      # A workspace grows by one web app, installed and formatted as prumo add does it, before it is verified.
      - name: Add an app to ${{ matrix.name }}
        if: matrix.architecture == 'monorepo'
        run: node ${{ github.workspace }}/cli/src/cli.ts add web portal
        working-directory: ${{ runner.temp }}/${{ matrix.name }}
      - name: Verify ${{ matrix.name }}
        run: >
          node cli/scripts/verify.mjs ${{ runner.temp }}/${{ matrix.name }}
          --types ${{ matrix.types }} --architecture ${{ matrix.architecture }}

  floor:
    # The Node floor that engines promises. It runs the built CLI, as a user does,
    # and the project it generates passes the same verification as the matrix above.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cli
      - run: pnpm build
        working-directory: cli
      - name: Generate on the floor
        run: node ${{ github.workspace }}/cli/dist/cli.js new floor --types api,web --single-tenant --no-mcp --no-email --no-social
        working-directory: ${{ runner.temp }}
      - name: Verify on the floor
        run: >
          node cli/scripts/verify.mjs ${{ runner.temp }}/floor
          --types api,web --architecture monorepo

  # Windows, natively: the project in a Windows folder, run by the Windows Node and pnpm. These jobs are added beside
  # the ones above rather than folded into them, because the rulesets require the existing names as they are.
  repository-windows:
    name: repository (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cli
      - run: pnpm lint
        working-directory: cli
      - run: pnpm typecheck
        working-directory: cli
      - run: pnpm test
        working-directory: cli

  packaged-windows:
    # The path a Windows user takes: npm's .cmd shim for the bin, and the tarball as npm leaves it.
    name: packaged (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cli
      - run: pnpm build
        working-directory: cli
      - run: npm pack --pack-destination ${{ runner.temp }}
        working-directory: cli
      - name: Install the packed CLI
        run: |
          npm init -y
          npm install (Get-ChildItem *.tgz).FullName
        working-directory: ${{ runner.temp }}
      - name: Generate from the installed package
        run: npx --no-install prumo new packaged --types api,web --single-tenant --no-mcp --no-email --no-social --skip-install
        working-directory: ${{ runner.temp }}
      - name: Assert what npm is known to delete arrived anyway
        run: |
          foreach ($file in '.gitignore', 'apps/api/.gitignore', 'apps/web/.gitignore', '.gitattributes',
                            '.githooks/pre-commit', 'apps/api/.env.example', '.prumo/INDEX.md') {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "missing $file" }
          }
          if (Test-Path -LiteralPath gitignore) { throw 'gitignore was not restored to .gitignore' }
        working-directory: ${{ runner.temp }}/packaged

  generated-windows:
    name: generated windows (${{ matrix.name }}, ${{ matrix.types }}, ${{ matrix.architecture }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-web
            types: web
            architecture: alone
          - name: a-mobile
            types: mobile
            architecture: alone
          - name: a-site
            types: site
            architecture: alone
          # The runner's Docker runs Windows containers only, where postgres:18-alpine cannot: verify.mjs builds the
          # api and says it skipped its tests, migration and start.
          - name: an-api
            types: api
            architecture: alone
            flags: --email
          # Every client in one workspace, which is the deepest tree `pnpm dev` starts.
          - name: clients
            types: web,mobile,site
            architecture: monorepo
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cli
      - name: Generate ${{ matrix.name }}
        run: node ${{ github.workspace }}/cli/src/cli.ts new ${{ matrix.name }} --types ${{ matrix.types }} --${{ matrix.architecture }} --single-tenant ${{ matrix.flags }}
        working-directory: ${{ runner.temp }}
      # A workspace grows by one web app, installed and formatted as prumo add does it, before it is verified.
      - name: Add an app to ${{ matrix.name }}
        if: matrix.architecture == 'monorepo'
        run: node ${{ github.workspace }}/cli/src/cli.ts add web portal
        working-directory: ${{ runner.temp }}/${{ matrix.name }}
      - name: Verify ${{ matrix.name }}
        run: >
          node cli/scripts/verify.mjs ${{ runner.temp }}/${{ matrix.name }}
          --types ${{ matrix.types }} --architecture ${{ matrix.architecture }}
      - name: Ctrl+C on pnpm dev stops every process and frees every port
        if: ${{ !contains(matrix.types, 'api') }}
        # verify-dev.mjs stops itself after nine minutes; this is the bound if even that fails.
        timeout-minutes: 12
        run: node cli/scripts/verify-dev.mjs ${{ runner.temp }}/${{ matrix.name }}

  publish:
    # Publishing is a version bump landing on main: this job compares cli/package.json with what the registry holds
    # and does nothing when they agree. It waits for every other job, because the matrix above is what proves a
    # generated project runs.
    needs: [repository, packaged, generated, floor, repository-windows, packaged-windows, generated-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-npm
      cancel-in-progress: false
    permissions:
      # Trusted publishing: npm mints a short-lived token from this, so the repository holds no npm secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cli/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml
      - name: Take an npm that can publish through OIDC
        # Trusted publishing needs npm 11.5.1 or later; whatever ships with Node may be older.
        run: npm install -g npm@latest
      - name: Decide whether this version is new
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          published=$(npm view @stjoseph/prumo versions --json 2>/dev/null || echo '[]')
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if node -e "process.exit(JSON.parse(process.argv[1]).includes(process.argv[2]) ? 0 : 1)" "$published" "$version"; then
            echo "Version $version is already on npm; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is not on npm yet."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: cli
      - run: pnpm install
        if: steps.version.outputs.new == 'true'
        working-directory: cli
      - name: Publish ${{ steps.version.outputs.version }}
        # `prepack` builds and copies the templates in. Provenance needs no flag: npm adds it for a public package
        # published from a public repository through OIDC.
        if: steps.version.outputs.new == 'true'
        run: npm publish --access public
        working-directory: cli
