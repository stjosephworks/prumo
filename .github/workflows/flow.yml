name: Flow

# Rulesets can require a pull request, but none of their rules can say where that pull request may come from.
# This check is that rule: main takes staging, staging takes dev, dev takes a project or a branch of a known kind, and
# a project takes only its tasks.
on:
  pull_request:
    branches: [main, staging, dev, 'project/**']

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check where this pull request comes from
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          refuse() {
            echo "A pull request into $BASE must come from $1, and this one comes from $HEAD."
            echo "The chain is: task/, fix/, chore/, docs/ or refactor/ -> dev -> staging -> main."
            echo "Large work goes task/<name> -> project/<name> -> dev, and reaches dev only when it is ready to ship."
            exit 1
          }

          case "$BASE" in
            main)
              [ "$HEAD" = 'staging' ] || refuse 'staging'
              ;;
            staging)
              [ "$HEAD" = 'dev' ] || refuse 'dev'
              ;;
            dev)
              case "$HEAD" in
                project/* | task/* | fix/* | chore/* | docs/* | refactor/*) ;;
                *) refuse 'project/, task/, fix/, chore/, docs/ or refactor/' ;;
              esac
              ;;
            project/*)
              case "$HEAD" in
                task/*) ;;
                *) refuse 'task/' ;;
              esac
              ;;
          esac

          echo "$HEAD -> $BASE follows the chain."
